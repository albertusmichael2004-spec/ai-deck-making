[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-presentation-studio"
version = "1.0.0"
description = "Contract-bound consulting presentation compiler"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0", "python-pptx==1.0.2", "lxml>=6,<7", "openpyxl==3.1.5", "PyMuPDF==1.28.2", "python-docx==1.2.0", "Pillow==12.3.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
native = ["pywin32==312; sys_platform == 'win32'"]

[project.scripts]
studio = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "runtime/python_packages"]
testpaths = ["tests/unit", "tests/integration", "tests/regression", "tests/e2e"]
addopts = "-ra"
